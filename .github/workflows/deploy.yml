name: Deploy

on:
  push:
    branches: [main]

# Don't cancel an in-flight rollout when a new merge lands — let the prior
# Cloud Run / Vercel deploy finish, then run the next one. Different from CI's
# cancel-in-progress: true because deploys aren't safe to interrupt mid-flight.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

# Least-privilege default for every job's GITHUB_TOKEN. Jobs that need more
# (WIF auth via id-token) opt in per job below.
permissions:
  contents: read

jobs:
  # Belt-and-braces on top of `concurrency` above: if a newer commit has
  # already landed on main while this run was queued, short-circuit to a
  # green no-op instead of redeploying a now-superseded SHA on top of the
  # newer one. Concurrency keeps deploys serialised; this keeps them
  # monotonic. Every downstream job gates on `is_head == 'true'`.
  head-check:
    runs-on: ubuntu-24.04-arm
    outputs:
      is_head: ${{ steps.check.outputs.is_head }}
      head_sha: ${{ steps.check.outputs.head_sha }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - id: check
        env:
          # `gh api` uses GH_TOKEN; the workflow's default GITHUB_TOKEN has
          # `contents: read`, which is enough to read main's HEAD SHA on a
          # private repo. Plain `git ls-remote` would prompt for credentials
          # and silently produce an empty SHA here.
          GH_TOKEN: ${{ github.token }}
        run: |
          HEAD_SHA=$(gh api "repos/${{ github.repository }}/commits/main" --jq .sha)
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          if [ "$HEAD_SHA" = "${{ github.sha }}" ]; then
            echo "is_head=true" >> "$GITHUB_OUTPUT"
            echo "This run's SHA is current main HEAD — proceeding."
          else
            echo "is_head=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Superseded by $HEAD_SHA — skipping deploy for ${{ github.sha }}."
          fi

  changes:
    needs: [head-check]
    if: needs.head-check.outputs.is_head == 'true'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'Makefile'
              - '.github/workflows/deploy.yml'
            frontend:
              - 'frontend/**'
              - 'Makefile'
              - '.github/workflows/deploy.yml'
            infra:
              - 'infra/**'
              - '.github/workflows/deploy.yml'

  tf-apply:
    # Branch scoping is enforced by the workflow trigger (push to main only),
    # which keeps the WIF binding symmetric with the deploy SA. Runs before
    # `deploy-backend` so a combined infra+backend change lands the service
    # config (env vars, secrets) before the new image rolls.
    needs: [changes]
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_TF_APPLY_SA }}

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.x
          terraform_wrapper: false

      - name: Terraform init
        run: terraform -chdir=infra init -input=false

      - name: Terraform apply
        env:
          TF_VAR_github_token: ${{ secrets.TF_GITHUB_TOKEN }}
          TF_VAR_gcp_wif_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          TF_VAR_billing_account_id: ${{ secrets.GCP_BILLING_ACCOUNT_ID }}
          TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
        run: terraform -chdir=infra apply -auto-approve -input=false

  deploy-backend:
    needs: [changes, tf-apply]
    if: |
      always() &&
      (needs.tf-apply.result == 'success' || needs.tf-apply.result == 'skipped') &&
      needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      # Image tag = commit SHA so Cloud Run revisions are traceable to a commit.
      # Service config (env vars, secrets, scaling, concurrency, timeout, CPU,
      # ingress, invoker IAM) is owned by Terraform — see infra/cloud_run.tf.
      # This job only ships a new image; everything else flows through `tf apply`.
      - name: Build and push image
        env:
          IMAGE: europe-west1-docker.pkg.dev/${{ steps.auth.outputs.project_id }}/cloud-run-source-deploy/${{ vars.GCP_SERVICE_NAME }}:${{ github.sha }}
        run: |
          # --suppress-logs: belt-and-braces; the load-bearing fix is
          # roles/viewer on the deploy SA (gcloud's upfront check is for
          # project Viewer/Owner and isn't satisfied by scoped roles).
          gcloud builds submit backend --tag "$IMAGE" --suppress-logs
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy image to Cloud Run
        run: |
          gcloud run services update "${{ vars.GCP_SERVICE_NAME }}" \
            --region "${{ vars.GCP_REGION }}" \
            --image "$IMAGE"

  deploy-frontend:
    # Runs after deploy-backend so a backend+frontend change ships the API
    # before the UI that depends on it. Tolerates deploy-backend being skipped
    # (frontend-only change) but not failed/cancelled.
    needs: [changes, deploy-backend]
    if: |
      always() &&
      (needs.deploy-backend.result == 'success' || needs.deploy-backend.result == 'skipped') &&
      needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-24.04-arm
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      # Vercel CLI uses cwd to find the linked project (`frontend/.vercel/`)
      # and to write `.vercel/.env.production.local`. The dashboard's Root
      # Directory setting only applies to git-integration builds, not CLI
      # invocations — so these must run from `frontend/`.
      - name: Pull Vercel environment
        run: pnpm dlx vercel@65.8.0 pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Cache Next.js build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: frontend/.next/cache
          key: nextjs-vercel-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}-${{ hashFiles('frontend/**/*.[jt]s', 'frontend/**/*.[jt]sx') }}
          restore-keys: |
            nextjs-vercel-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}-
            nextjs-vercel-${{ runner.os }}-${{ runner.arch }}-

      - name: Build
        run: pnpm dlx vercel@65.8.0 build --prod --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Deploy
        run: pnpm dlx vercel@65.8.0 deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}"
