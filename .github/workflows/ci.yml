name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Single job for lint + test + build. Not worth splitting into parallel jobs
  # yet — runner setup overhead (~30-60s each) exceeds the time saved while the
  # total pipeline is under a couple of minutes.
  ci:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: true

      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.11
          working-directory: backend

      - name: Install frontend dependencies
        run: cd frontend && pnpm install --frozen-lockfile

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      - name: Build backend
        run: make build-backend

      - name: Build frontend
        run: make build-frontend

  deploy-backend:
    needs: [ci]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy freewhen-api \
            --source . \
            --region europe-west2 \
            --platform managed \
            --allow-unauthenticated \
            --min-instances 0 \
            --max-instances 3 \
            --memory 256Mi \
            --set-secrets DATABASE_URL=freewhen-database-url:latest
        working-directory: backend
