name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  changes:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'Makefile'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - 'Makefile'
              - '.github/workflows/ci.yml'
            infra:
              - 'infra/**'
              - '.github/workflows/ci.yml'

  # Single job for lint + test + build. Not worth splitting into parallel jobs
  # yet — runner setup overhead (~30-60s each) exceeds the time saved while the
  # total pipeline is under a couple of minutes.
  ci:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: true

      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.11
          working-directory: backend

      - name: Install frontend dependencies
        run: cd frontend && pnpm install --frozen-lockfile

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      - name: Cache embedded-postgres binary
        uses: actions/cache@v4
        with:
          path: ~/.embedded-postgres-go
          key: embedded-postgres-${{ runner.os }}-${{ runner.arch }}-v16

      - name: Test (integration)
        run: make test-integration

      - name: Build backend
        run: make build-backend

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: frontend/.next/cache
          key: nextjs-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}-${{ hashFiles('frontend/**/*.[jt]s', 'frontend/**/*.[jt]sx') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}-
            nextjs-${{ runner.os }}-${{ runner.arch }}-

      - name: Build frontend
        run: make build-frontend

  tf-plan:
    needs: [changes]
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_TF_PLAN_SA }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.x
          terraform_wrapper: false

      - name: Terraform init
        run: terraform -chdir=infra init -input=false

      - name: Terraform plan
        id: plan
        env:
          # Variables consumed by the github provider + tfvars at plan time.
          # The github provider's token comes from var.github_token (set
          # via TF_VAR_github_token) — kept distinct from $GITHUB_TOKEN so
          # the gh CLI / other tooling don't fight over the same env var.
          # Need a fine-grained PAT (not the default workflow token) because
          # TF refreshes `github_actions_variable` / `github_actions_secret`
          # state via API endpoints that require Variables/Secrets read scope.
          TF_VAR_github_token: ${{ secrets.TF_GITHUB_TOKEN }}
          TF_VAR_gcp_wif_provider: ${{ secrets.GCP_WIF_PROVIDER }}
        run: |
          set +e
          terraform -chdir=infra plan -no-color -detailed-exitcode -out=tfplan > plan.txt 2>&1
          echo "exitcode=$?" >> "$GITHUB_OUTPUT"
          {
            echo 'plan<<EOF'
            cat plan.txt
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          PLAN: ${{ steps.plan.outputs.plan }}
          EXITCODE: ${{ steps.plan.outputs.exitcode }}
        with:
          script: |
            const { PLAN, EXITCODE } = process.env;
            const header = EXITCODE === '0'
              ? '### Terraform plan: no changes'
              : EXITCODE === '2'
                ? '### Terraform plan: changes detected'
                : '### Terraform plan: errored';
            const body = `${header}\n\n<details><summary>plan output</summary>\n\n\`\`\`\n${PLAN.slice(0, 60000)}\n\`\`\`\n\n</details>`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      - name: Fail on plan error
        if: steps.plan.outputs.exitcode == '1'
        run: exit 1

  deploy-backend:
    needs: [ci, changes]
    if: github.ref == 'refs/heads/main' && needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "${{ vars.GCP_SERVICE_NAME }}" \
            --source . \
            --region "${{ vars.GCP_REGION }}" \
            --platform managed \
            --allow-unauthenticated \
            --ingress all \
            --execution-environment gen1 \
            --cpu-boost \
            --cpu 1 \
            --memory "${{ vars.GCP_MEMORY }}" \
            --min-instances 0 \
            --max-instances "${{ vars.GCP_MAX_INSTANCES }}" \
            --concurrency 80 \
            --timeout 300 \
            --set-env-vars "LOG_LEVEL=info,CORS_ORIGIN=https://freewhen.simonperryman.co.uk,COOKIE_DOMAIN=.freewhen.simonperryman.co.uk,FRONTEND_URL=https://freewhen.simonperryman.co.uk,MAGIC_LINK_FROM_EMAIL=onboarding@resend.dev,AUTH_EMAIL_DISABLED=false,GOOGLE_REDIRECT_URL=https://api.freewhen.simonperryman.co.uk/auth/google/callback,GOOGLE_CALENDAR_REDIRECT_URL=https://api.freewhen.simonperryman.co.uk/auth/google/calendar/callback" \
            --set-secrets "DATABASE_URL=freewhen-database-url:latest,CALENDAR_ACCESS_SECRET=freewhen-calendar-secret:latest,RESEND_API_KEY=freewhen-resend-api-key:latest,GOOGLE_CLIENT_ID=freewhen-google-client-id:latest,GOOGLE_CLIENT_SECRET=freewhen-google-client-secret:latest"
        working-directory: backend

  deploy-frontend:
    # Runs after deploy-backend so a backend+frontend change ships the API
    # before the UI that depends on it. Tolerates deploy-backend being skipped
    # (frontend-only change) but not failed/cancelled.
    needs: [ci, changes, deploy-backend]
    if: |
      always() &&
      needs.ci.result == 'success' &&
      (needs.deploy-backend.result == 'success' || needs.deploy-backend.result == 'skipped') &&
      github.ref == 'refs/heads/main' &&
      needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-24.04-arm
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      # Vercel project has Root Directory set to `frontend` in the dashboard,
      # so the CLI handles the cd itself — run these from the repo root.
      - name: Pull Vercel environment
        run: pnpm dlx vercel@latest pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: frontend/.next/cache
          key: nextjs-vercel-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}-${{ hashFiles('frontend/**/*.[jt]s', 'frontend/**/*.[jt]sx') }}
          restore-keys: |
            nextjs-vercel-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}-
            nextjs-vercel-${{ runner.os }}-${{ runner.arch }}-

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: frontend/.next/cache
          key: nextjs-vercel-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}-${{ hashFiles('frontend/**/*.[jt]s', 'frontend/**/*.[jt]sx') }}
          restore-keys: |
            nextjs-vercel-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}-
            nextjs-vercel-${{ runner.os }}-${{ runner.arch }}-

      - name: Build
        run: pnpm dlx vercel@latest build --prod --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Deploy
        run: pnpm dlx vercel@latest deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}"
