name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  changes:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'Makefile'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - 'Makefile'
              - '.github/workflows/ci.yml'

  # Single job for lint + test + build. Not worth splitting into parallel jobs
  # yet — runner setup overhead (~30-60s each) exceeds the time saved while the
  # total pipeline is under a couple of minutes.
  ci:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: true

      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.11
          working-directory: backend

      - name: Install frontend dependencies
        run: cd frontend && pnpm install --frozen-lockfile

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      - name: Cache embedded-postgres binary
        uses: actions/cache@v4
        with:
          path: ~/.embedded-postgres-go
          key: embedded-postgres-${{ runner.os }}-${{ runner.arch }}-v16

      - name: Test (integration)
        run: make test-integration

      - name: Build backend
        run: make build-backend

      - name: Build frontend
        run: make build-frontend

  deploy-backend:
    needs: [ci, changes]
    if: github.ref == 'refs/heads/main' && needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "${{ vars.GCP_SERVICE_NAME }}" \
            --source . \
            --region "${{ vars.GCP_REGION }}" \
            --platform managed \
            --allow-unauthenticated \
            --ingress all \
            --execution-environment gen1 \
            --cpu-boost \
            --cpu 1 \
            --memory "${{ vars.GCP_MEMORY }}" \
            --min-instances 0 \
            --max-instances "${{ vars.GCP_MAX_INSTANCES }}" \
            --concurrency 80 \
            --timeout 300 \
            --set-env-vars "LOG_LEVEL=info,CORS_ORIGIN=https://freewhen.simonperryman.co.uk,COOKIE_DOMAIN=.freewhen.simonperryman.co.uk,FRONTEND_URL=https://freewhen.simonperryman.co.uk,MAGIC_LINK_FROM_EMAIL=onboarding@resend.dev,AUTH_EMAIL_DISABLED=false,GOOGLE_REDIRECT_URL=https://api.freewhen.simonperryman.co.uk/auth/google/callback,GOOGLE_CALENDAR_REDIRECT_URL=https://api.freewhen.simonperryman.co.uk/auth/google/calendar/callback" \
            --set-secrets "DATABASE_URL=freewhen-database-url:latest,CALENDAR_ACCESS_SECRET=freewhen-calendar-secret:latest,RESEND_API_KEY=freewhen-resend-api-key:latest,GOOGLE_CLIENT_ID=freewhen-google-client-id:latest,GOOGLE_CLIENT_SECRET=freewhen-google-client-secret:latest"
        working-directory: backend

  deploy-frontend:
    # Runs after deploy-backend so a backend+frontend change ships the API
    # before the UI that depends on it. Tolerates deploy-backend being skipped
    # (frontend-only change) but not failed/cancelled.
    needs: [ci, changes, deploy-backend]
    if: |
      always() &&
      needs.ci.result == 'success' &&
      (needs.deploy-backend.result == 'success' || needs.deploy-backend.result == 'skipped') &&
      github.ref == 'refs/heads/main' &&
      needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-24.04-arm
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Pull Vercel environment
        run: pnpm dlx vercel@latest pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"
        working-directory: frontend

      - name: Build
        run: pnpm dlx vercel@latest build --prod --token="${{ secrets.VERCEL_TOKEN }}"
        working-directory: frontend

      - name: Deploy
        run: pnpm dlx vercel@latest deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}"
        working-directory: frontend
