name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Dedup duplicate webhook deliveries (e.g. double-click on Merge) so we
# don't burn CI minutes running the same SHA twice. Per-SHA group key
# means PR pushes to a branch still cancel earlier in-progress runs of
# that branch's prior SHA, but two pushes for the *same* SHA collapse.
concurrency:
  group: ci-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

# Least-privilege default for every job's GITHUB_TOKEN. Jobs that need more
# (paths-filter on PRs, WIF auth, PR comments) opt in per job below.
permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'Makefile'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - 'Makefile'
              - '.github/workflows/ci.yml'
            infra:
              - 'infra/**'
              - '.github/workflows/ci.yml'

  # Single job for lint + test + build. Not worth splitting into parallel jobs
  # yet — runner setup overhead (~30-60s each) exceeds the time saved while the
  # total pipeline is under a couple of minutes.
  ci:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: backend/go.mod
          cache: true

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15
          working-directory: backend

      - name: Install frontend dependencies
        run: cd frontend && pnpm install --frozen-lockfile

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      - name: Cache embedded-postgres binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.embedded-postgres-go
          key: embedded-postgres-${{ runner.os }}-${{ runner.arch }}-v16

      - name: Test (integration)
        run: make test-integration

      - name: Build backend
        run: make build-backend

      - name: Cache Next.js build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: frontend/.next/cache
          key: nextjs-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}-${{ hashFiles('frontend/**/*.[jt]s', 'frontend/**/*.[jt]sx') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}-
            nextjs-${{ runner.os }}-${{ runner.arch }}-

      - name: Build frontend
        run: make build-frontend

  # Playwright e2e suite. Boots embedded Postgres + Go backend (with
  # E2E_TEST_MODE=true) and Next.js dev server, then drives Chromium.
  # Skipped on infra-only PRs (no backend/frontend change).
  e2e:
    needs: [changes]
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: backend/go.mod
          cache: true

      - name: Install frontend dependencies
        run: cd frontend && pnpm install --frozen-lockfile

      - name: Cache embedded-postgres binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.embedded-postgres-go
          key: embedded-postgres-${{ runner.os }}-${{ runner.arch }}-v16

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-${{ runner.arch }}-

      # Split into browser-bytes (cacheable) and OS deps (apt, not cacheable
      # via actions/cache). Skipping the browser download entirely on a cache
      # hit shaves ~25s; the apt step still runs every time, but the browser
      # binary alone is the bulk of `--with-deps`.
      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: cd frontend && pnpm exec playwright install chromium

      - name: Install Playwright system deps
        run: cd frontend && pnpm exec playwright install-deps chromium

      - name: Run e2e suite
        env:
          CI: 'true'
        run: make test-e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces
          path: frontend/test-results/
          retention-days: 14

  tf-plan:
    needs: [changes]
    # Skip fork PRs: they get no secrets or OIDC token, so the plan would fail,
    # and we never want untrusted code running with WIF credentials.
    if: |
      needs.changes.outputs.infra == 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_TF_PLAN_SA }}

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.x
          terraform_wrapper: false

      - name: Terraform init
        run: terraform -chdir=infra init -input=false

      - name: Terraform plan
        id: plan
        env:
          # Variables consumed by the github provider + tfvars at plan time.
          # The github provider's token comes from var.github_token (set
          # via TF_VAR_github_token) — kept distinct from $GITHUB_TOKEN so
          # the gh CLI / other tooling don't fight over the same env var.
          # Need a fine-grained PAT (not the default workflow token) because
          # TF refreshes `github_actions_variable` / `github_actions_secret`
          # state via API endpoints that require Variables/Secrets read scope.
          TF_VAR_github_token: ${{ secrets.TF_GITHUB_TOKEN }}
          TF_VAR_gcp_wif_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          TF_VAR_billing_account_id: ${{ secrets.GCP_BILLING_ACCOUNT_ID }}
          TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
        run: |
          set +e
          terraform -chdir=infra plan -no-color -detailed-exitcode -out=tfplan > plan.txt 2>&1
          echo "exitcode=$?" >> "$GITHUB_OUTPUT"
          # `sensitive` hides the variable, not resource IDs built from it: the
          # budget's ID embeds the billing account, and this text becomes a
          # public PR comment.
          sed -i -E 's#billingAccounts/[A-Za-z0-9-]+#billingAccounts/REDACTED#g' plan.txt
          {
            echo 'plan<<EOF'
            cat plan.txt
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PLAN: ${{ steps.plan.outputs.plan }}
          EXITCODE: ${{ steps.plan.outputs.exitcode }}
        with:
          script: |
            const { PLAN, EXITCODE } = process.env;
            const header = EXITCODE === '0'
              ? '### Terraform plan: no changes'
              : EXITCODE === '2'
                ? '### Terraform plan: changes detected'
                : '### Terraform plan: errored';
            const body = `${header}\n\n<details><summary>plan output</summary>\n\n\`\`\`\n${PLAN.slice(0, 60000)}\n\`\`\`\n\n</details>`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      - name: Fail on plan error
        if: steps.plan.outputs.exitcode == '1'
        run: exit 1
