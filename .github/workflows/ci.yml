name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Dedup duplicate webhook deliveries (e.g. double-click on Merge) so we
# don't burn CI minutes running the same SHA twice. Per-SHA group key
# means PR pushes to a branch still cancel earlier in-progress runs of
# that branch's prior SHA, but two pushes for the *same* SHA collapse.
concurrency:
  group: ci-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'Makefile'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - 'Makefile'
              - '.github/workflows/ci.yml'
            infra:
              - 'infra/**'
              - '.github/workflows/ci.yml'

  # Single job for lint + test + build. Not worth splitting into parallel jobs
  # yet — runner setup overhead (~30-60s each) exceeds the time saved while the
  # total pipeline is under a couple of minutes.
  ci:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: true

      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.11
          working-directory: backend

      - name: Install frontend dependencies
        run: cd frontend && pnpm install --frozen-lockfile

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      - name: Cache embedded-postgres binary
        uses: actions/cache@v4
        with:
          path: ~/.embedded-postgres-go
          key: embedded-postgres-${{ runner.os }}-${{ runner.arch }}-v16

      - name: Test (integration)
        run: make test-integration

      - name: Build backend
        run: make build-backend

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: frontend/.next/cache
          key: nextjs-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}-${{ hashFiles('frontend/**/*.[jt]s', 'frontend/**/*.[jt]sx') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}-
            nextjs-${{ runner.os }}-${{ runner.arch }}-

      - name: Build frontend
        run: make build-frontend

  # Playwright e2e suite. Boots embedded Postgres + Go backend (with
  # E2E_TEST_MODE=true) and Next.js dev server, then drives Chromium.
  # Skipped on infra-only PRs (no backend/frontend change).
  e2e:
    needs: [changes]
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: true

      - name: Install frontend dependencies
        run: cd frontend && pnpm install --frozen-lockfile

      - name: Cache embedded-postgres binary
        uses: actions/cache@v4
        with:
          path: ~/.embedded-postgres-go
          key: embedded-postgres-${{ runner.os }}-${{ runner.arch }}-v16

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-${{ runner.arch }}-

      - name: Install Playwright Chromium + system deps
        run: cd frontend && pnpm exec playwright install --with-deps chromium

      - name: Run e2e suite
        env:
          CI: 'true'
        run: make test-e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: frontend/test-results/
          retention-days: 14

  tf-plan:
    needs: [changes]
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_TF_PLAN_SA }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.x
          terraform_wrapper: false

      - name: Terraform init
        run: terraform -chdir=infra init -input=false

      - name: Terraform plan
        id: plan
        env:
          # Variables consumed by the github provider + tfvars at plan time.
          # The github provider's token comes from var.github_token (set
          # via TF_VAR_github_token) — kept distinct from $GITHUB_TOKEN so
          # the gh CLI / other tooling don't fight over the same env var.
          # Need a fine-grained PAT (not the default workflow token) because
          # TF refreshes `github_actions_variable` / `github_actions_secret`
          # state via API endpoints that require Variables/Secrets read scope.
          TF_VAR_github_token: ${{ secrets.TF_GITHUB_TOKEN }}
          TF_VAR_gcp_wif_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          TF_VAR_billing_account_id: ${{ secrets.GCP_BILLING_ACCOUNT_ID }}
          TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
        run: |
          set +e
          terraform -chdir=infra plan -no-color -detailed-exitcode -out=tfplan > plan.txt 2>&1
          echo "exitcode=$?" >> "$GITHUB_OUTPUT"
          {
            echo 'plan<<EOF'
            cat plan.txt
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          PLAN: ${{ steps.plan.outputs.plan }}
          EXITCODE: ${{ steps.plan.outputs.exitcode }}
        with:
          script: |
            const { PLAN, EXITCODE } = process.env;
            const header = EXITCODE === '0'
              ? '### Terraform plan: no changes'
              : EXITCODE === '2'
                ? '### Terraform plan: changes detected'
                : '### Terraform plan: errored';
            const body = `${header}\n\n<details><summary>plan output</summary>\n\n\`\`\`\n${PLAN.slice(0, 60000)}\n\`\`\`\n\n</details>`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      - name: Fail on plan error
        if: steps.plan.outputs.exitcode == '1'
        run: exit 1

  tf-apply:
    # Applies infra changes on pushes to main only. Branch scoping is enforced
    # here (not in IAM) so the WIF binding can stay symmetric with the deploy
    # SA. Runs after `ci` so a broken codebase doesn't trigger an apply, and
    # before `deploy-backend` so a combined infra+backend change lands the
    # service config (env vars, secrets) before the new image rolls.
    needs: [ci, changes]
    if: github.ref == 'refs/heads/main' && needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_TF_APPLY_SA }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.x
          terraform_wrapper: false

      - name: Terraform init
        run: terraform -chdir=infra init -input=false

      - name: Terraform apply
        env:
          TF_VAR_github_token: ${{ secrets.TF_GITHUB_TOKEN }}
          TF_VAR_gcp_wif_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          TF_VAR_billing_account_id: ${{ secrets.GCP_BILLING_ACCOUNT_ID }}
          TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
        run: terraform -chdir=infra apply -auto-approve -input=false

  deploy-backend:
    needs: [ci, e2e, changes, tf-apply]
    if: |
      always() &&
      needs.ci.result == 'success' &&
      (needs.e2e.result == 'success' || needs.e2e.result == 'skipped') &&
      (needs.tf-apply.result == 'success' || needs.tf-apply.result == 'skipped') &&
      github.ref == 'refs/heads/main' &&
      needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      # Image tag = commit SHA so Cloud Run revisions are traceable to a commit.
      # Service config (env vars, secrets, scaling, concurrency, timeout, CPU,
      # ingress, invoker IAM) is owned by Terraform — see infra/cloud_run.tf.
      # This job only ships a new image; everything else flows through `tf apply`.
      - name: Build and push image
        env:
          IMAGE: europe-west1-docker.pkg.dev/${{ steps.auth.outputs.project_id }}/cloud-run-source-deploy/${{ vars.GCP_SERVICE_NAME }}:${{ github.sha }}
        run: |
          # --suppress-logs: belt-and-braces; the load-bearing fix is
          # roles/viewer on the deploy SA (gcloud's upfront check is for
          # project Viewer/Owner and isn't satisfied by scoped roles).
          gcloud builds submit backend --tag "$IMAGE" --suppress-logs
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy image to Cloud Run
        run: |
          gcloud run services update "${{ vars.GCP_SERVICE_NAME }}" \
            --region "${{ vars.GCP_REGION }}" \
            --image "$IMAGE"

  deploy-frontend:
    # Runs after deploy-backend so a backend+frontend change ships the API
    # before the UI that depends on it. Tolerates deploy-backend being skipped
    # (frontend-only change) but not failed/cancelled.
    needs: [ci, e2e, changes, deploy-backend]
    if: |
      always() &&
      needs.ci.result == 'success' &&
      (needs.e2e.result == 'success' || needs.e2e.result == 'skipped') &&
      (needs.deploy-backend.result == 'success' || needs.deploy-backend.result == 'skipped') &&
      github.ref == 'refs/heads/main' &&
      needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-24.04-arm
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      # Vercel CLI uses cwd to find the linked project (`frontend/.vercel/`)
      # and to write `.vercel/.env.production.local`. The dashboard's Root
      # Directory setting only applies to git-integration builds, not CLI
      # invocations — so these must run from `frontend/`.
      - name: Pull Vercel environment
        run: pnpm dlx vercel@latest pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: frontend/.next/cache
          key: nextjs-vercel-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}-${{ hashFiles('frontend/**/*.[jt]s', 'frontend/**/*.[jt]sx') }}
          restore-keys: |
            nextjs-vercel-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}-
            nextjs-vercel-${{ runner.os }}-${{ runner.arch }}-

      - name: Build
        run: pnpm dlx vercel@latest build --prod --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Deploy
        run: pnpm dlx vercel@latest deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}"
